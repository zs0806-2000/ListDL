<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ListDL</title>
  <style>
    body { font: 14px system-ui, sans-serif; width: 280px; margin: 12px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { margin: 0 0 10px; color: #444; }
    button { width: 100%; padding: 8px; margin-bottom: 6px; font: inherit; cursor: pointer; }
    #msg { color: #a00; min-height: 1em; }
  </style>
</head>
<body>
  <h1>ListDL</h1>
  <p>Open a Scribd list (or your Saved page), then scan it.</p>
  <button id="scan">Scan this list</button>
  <button id="open">Open download manager</button>
  <p id="msg"></p>
  <script src="popup.js" type="module"></script>
</body>
</html>
